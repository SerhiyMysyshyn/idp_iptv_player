// They are immutable data classes all the same — tell the Compose compiler to treat them as
// stable so screens holding them do not recompose needlessly.
// https://developer.android.com/develop/ui/compose/performance/stability/fix#configuration-file
com.serhiimysyshyn.devlightiptvclient.domain.model.*
