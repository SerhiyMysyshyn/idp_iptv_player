# detekt configuration file
# See https://detekt.github.io/detekt/configurations.html

build:
  maxIssues: 0
  weights:
    complexity: 2
    LongParameterList: 1
    style: 1

processors:
  active: true
  autoCorrect: true

console-reports:
  active: true
  excludeCorrectable: false
  exclude: '.*Test.*'

output-reports:
  xml:
    enabled: true
    destination: 'build/reports/detekt/detekt.xml'
  html:
    enabled: true
    destination: 'build/reports/detekt/detekt.html'
  txt:
    enabled: true
    destination: 'build/reports/detekt/detekt.txt'

config:
  validation: true

# --- Rules ---
comments:
  CommentOverPrivateFunction:
    active: true
  UndocumentedPublicClass:
    active: false

complexity:
  ComplexInterface:
    active: true
  LargeClass:
    active: true
    threshold: 500
  LongMethod:
    active: true
    threshold: 30
  LongParameterList:
    active: true
    threshold: 5
  TooManyFunctions:
    active: true
    threshold: 20

naming:
  VariableNaming:
    active: true
    variablePattern: '^[a-z][A-Za-z0-9]*$'
  FunctionNaming:
    active: true
    functionPattern: '^[a-z][A-Za-z0-9]*$'
  ClassNaming:
    active: true
    classPattern: '^[A-Z][A-Za-z0-9]*$'

performance:
  ForEachOnRange:
    active: true
  SpreadOperator:
    active: true

potential-bugs:
  UnsafeCallOnNullableType:
    active: true
  UnreachableCode:
    active: true

style:
  MagicNumber:
    active: false
  DataClassContainsFunctions:
    active: true
  OptionalUnit:
    active: true
  EndOfFile:
    active: true
